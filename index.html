 <!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      margin: 0; 
      font-family: 'Arial Black', sans-serif; 
      background: #000;
      overflow-x: hidden;
    }

    .banner {
      position: relative;
      height: 120px;
      background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      overflow: hidden;
    }

    /* Éclairs clignotants */
    .lightning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, transparent 10%, rgba(255,255,255,0.8) 20%, transparent 30%),
        radial-gradient(circle at 80% 20%, transparent 15%, rgba(255,255,0,0.6) 25%, transparent 35%),
        radial-gradient(circle at 50% 50%, transparent 5%, rgba(255,200,0,0.4) 15%, transparent 25%);
      animation: flash 3s ease-in-out infinite;
      opacity: 0;
      pointer-events: none;
    }



 

    /* Texte doré brillant */
    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5em;
      color: 'black';
      text-shadow: 
        0 0 10px #FFD700,
        0 0 20px #FFD700,
        0 0 30px #FF8C00,
        0 0 40px #FF4500;
      animation: glow 2s ease-in-out infinite alternate;
      z-index: 10;
      text-align: center;
      letter-spacing: 3px;
    }

   
   

    @keyframes glow {
      from { 
        text-shadow: 
          0 0 10px 'black', 0 0 20px 'black', 0 0 30px 'black', 0 0 40px 'black';
      }
      to { 
        text-shadow: 
          0 0 20px 'black', 0 0 30px 'black', 0 0 40px 'black', 0 0 50px 'black';
      }
    }

    @media (max-width: 768px) {
      .title { font-size: 1.8em; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="lightning"></div>
    <h1 class="title">⚡ CIRCULEZ RENNAIS ⚡</h1>
  </div>
</body>
</html>
